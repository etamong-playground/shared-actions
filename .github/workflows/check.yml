name: Action checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source scope
        run: python3 -m unittest discover -s tests -v
      - name: Parse action metadata
        run: ruby -ryaml -e 'Dir.glob(".github/actions/*/action.y*ml").each { |path| YAML.safe_load(File.read(path), aliases:false) }'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
